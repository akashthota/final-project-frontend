<div class="login-container">
  <div class="login-card-wrapper">
    <mat-card class="login-card">
      <mat-card-header>
        <div class="header-content">
          <mat-icon class="login-icon">account_circle</mat-icon>
          <mat-card-title>Welcome Back</mat-card-title>
          <p class="login-subtitle">Sign in to continue to your account</p>
        </div>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              formControlName="email"
              placeholder="Enter your email"
            />
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')"
              >Email is required</mat-error
            >
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')"
              >Please enter a valid email</mat-error
            >
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="Enter your password"
            />
            <mat-icon matPrefix>lock</mat-icon>
            <button
              mat-icon-button
              matSuffix
              (click)="hidePassword = !hidePassword"
              type="button"
              aria-label="Toggle password visibility"
            >
              <mat-icon>{{
                hidePassword ? "visibility_off" : "visibility"
              }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')"
              >Password is required</mat-error
            >
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')"
              >Password must be at least 6 characters</mat-error
            >
          </mat-form-field>

          <div class="login-actions">
            <mat-checkbox color="primary">Remember me</mat-checkbox>
            <a class="forgot-password" routerLink="/forgot-password"
              >Forgot password?</a
            >
          </div>

          <button
            mat-raised-button
            color="primary"
            class="login-button"
            type="submit"
            [disabled]="loginForm.invalid || loading"
          >
            <mat-icon *ngIf="!loading">login</mat-icon>
            <mat-spinner
              *ngIf="loading"
              diameter="20"
              color="accent"
            ></mat-spinner>
            <span>{{ loading ? "Logging in..." : "Login" }}</span>
          </button>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <div class="register-option">
          <span>Don't have an account?</span>
          <a mat-button color="accent" routerLink="/register">Register Now</a>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
